<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:transparent; }
  svg { display:block; }
</style>
<body>
<script>
// Margin app icon — an oxblood margin rule down the left of a page, with a
// Fraunces M standing in the writing area. Same serif texture as the old "V"
// icon this replaced; the V simply became an M, and the margin rule was added
// beside it.
//
// Two deliberate properties, both learned the hard way:
//   * The M is optically centred on the WHOLE tile, not on the paper area left
//     over beside the band. Centring it in the leftover area pushes it right
//     and opens a gap that reads as a mistake.
//   * The band always runs flush to x=0. Insetting it to satisfy the maskable
//     safe zone is what once left a strip of bare paper down its left edge on
//     Android, since Android uses the maskable icon for the home screen.
//
// ?v=any|maskable   &s=<pixel size>
const q = new URLSearchParams(location.search);
const variant = q.get("v") || "any";
const size = parseInt(q.get("s") || "512", 10);

const PAPER = "#FBF9F4", OX = "#8A3033";

// The whole composition, as one set of numbers. The maskable variant is the
// same drawing scaled to 0.8 about the centre so it survives an aggressive
// circular crop -- keeping it a scale rather than a re-layout is what stops the
// two icons drifting apart the next time either is touched.
function composition(scale) {
  const at = (x) => 256 + (x - 256) * scale;
  return {
    // The band's RIGHT edge is what scales; its left edge stays pinned at x=0
    // rather than scaling to 51, which is the whole point above.
    band: at(96),
    mSize: 280 * scale,
    mCx: at(256),              // dead centre either way
    mBy: at(358),
  };
}

function art(maskable) {
  const c = composition(maskable ? 0.8 : 1);
  const bg = maskable
    ? `<rect width="512" height="512" fill="${PAPER}"/>`
    : `<rect width="512" height="512" rx="115" fill="${PAPER}"/>`;
  return bg
    + `<rect x="0" y="0" width="${c.band}" height="512" fill="${OX}"/>`
    + `<text x="${c.mCx}" y="${c.mBy}" font-family="Fraunces" font-weight="700"
         font-size="${c.mSize}" fill="${OX}" text-anchor="middle">M</text>`;
}

const maskable = variant === "maskable";
document.body.insertAdjacentHTML("beforeend",
  `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">
     <defs><clipPath id="r"><rect width="512" height="512" rx="${maskable ? 0 : 115}"/></clipPath></defs>
     <g clip-path="url(#r)">${art(maskable)}</g>
   </svg>`);
</script>
